[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "listy"
version = "0.1.0"
description = "Turns voice messages into letters (these long-form text things people barely write anymore)."
authors = [
    { name = "malyvsen", email = "5940672+malyvsen@users.noreply.github.com" },
]
dependencies = [
    "groq>=0.9.0",
    "tqdm>=4.66.5",
    "cerebras-cloud-sdk>=1.59.0",
    "asyncclick>=8.3.0.7",
    "pydantic>=2.12.5",
]
requires-python = "==3.14.*"
readme = "README.md"
license = { text = "GPLv3" }

[dependency-groups]
dev = [
    "ruff>=0.5.7",
    "deptry>=0.21.2",
    "ty>=0.0.1a33",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
